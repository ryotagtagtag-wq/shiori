; Gamebuino META 向けビルド設定（Arduino Zero / ATSAMD21G18 互換でエミュレートビルド）
; ビルド: pio run -e gamebuino_meta

[platformio]
src_dir = .

[env:gamebuino_meta]
platform = atmelsam
board = gamebuino_meta
framework = arduino
build_flags =
    -Os
    -Wall
    -Wextra
    -Werror
    -I.
    -Icore
    -Ihal
    -Iplatform/gamebuino
src_filter =
    +<platform/gamebuino/*.cpp>
    +<platform/gamebuino/*.hpp>
    -<platform/pc/*>

